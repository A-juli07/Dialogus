{% extends 'chat/base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card fade-in text-center">
        <div class="logout-icon">
            <i class="bi bi-check-circle"></i>
        </div>
        <h2>Você saiu com sucesso!</h2>
        <p class="text-muted mb-4">Sua sessão foi encerrada. Volte sempre!</p>
        <a href="{% url 'login' %}" class="btn btn-primary btn-modern">
            <i class="bi bi-box-arrow-in-right"></i> Entrar novamente
        </a>
        <a href="{% url 'index' %}" class="btn btn-outline-primary btn-modern mt-2">
            <i class="bi bi-house"></i> Ir para página inicial
        </a>
    </div>
</div>

<style>
.auth-container {
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
}

.auth-card {
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: var(--shadow-xl);
    padding: 3rem;
    max-width: 480px;
    width: 100%;
}

.logout-icon {
    width: 100px;
    height: 100px;
    margin: 0 auto 1.5rem;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    color: white;
    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
    animation: scaleIn 0.5s ease;
}

@keyframes scaleIn {
    from {
        transform: scale(0);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.auth-card h2 {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
}

.btn-modern {
    padding: 0.875rem 1.5rem;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    transition: all 0.3s ease;
    display: inline-block;
    text-decoration: none;
}

.btn-modern i {
    margin-right: 0.5rem;
}

.btn-modern:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
}

.btn-outline-primary {
    background: transparent;
    border: 2px solid var(--primary-color);
    color: var(--primary-color);
}

.btn-outline-primary:hover {
    background: var(--primary-color);
    color: white;
}

@media (max-width: 576px) {
    .auth-card {
        padding: 2rem 1.5rem;
    }

    .logout-icon {
        width: 80px;
        height: 80px;
        font-size: 2.5rem;
    }
}
</style>
{% endblock %}
